# Netlify Frontend Configuration for CyberSaathi AI
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_ORIGINS,PORT,NODE_ENV,FRONTEND_URL"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://cybersaathi-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback: Any route serves index.html with 200 HTTP status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control Headers:
# Immutable static hashed assets in /assets/
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must revalidate so updates are immediately visible to users
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker and manifest
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
