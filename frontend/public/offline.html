<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b14" />
    <title>Offline · CyberSaathi AI</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080b14; color: #e7eaf3; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 440px); padding: 30px; border: 1px solid #263248; border-radius: 18px; background: #101725; }
      h1 { margin: 0 0 12px; font-size: 1.65rem; }
      p { color: #aab5c8; line-height: 1.65; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 16px; border-radius: 10px; color: #06121a; background: #66d8e8; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>CyberSaathi can’t reach live services right now. Previously loaded app pages and cached academy lessons may still be available. Scans, AI, calls, chat, and saved progress need a connection.</p>
      <a href="/">Try the app again</a>
    </main>
  </body>
</html>
